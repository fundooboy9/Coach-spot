name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Fix Config & Compile APK
        run: |
          # 1. Ensure pubspec.yaml exists with valid name
          cat << 'EOF' > pubspec.yaml
          name: coach_spot
          description: "Train Coach Finder"
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: ">=3.4.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            firebase_core: ^3.8.0
            firebase_auth: ^5.3.3
            cloud_firestore: ^5.5.0
            google_maps_flutter: ^2.10.0
            image_picker: ^1.1.2
            google_mlkit_text_recognition: ^0.13.0
            geolocator: ^12.0.0
          flutter:
            uses-material-design: true
          EOF

          # 2. Fix directory casing
          if [ -d "Lib" ] && [ ! -d "lib" ]; then
            mv Lib lib
          fi

          # 3. Create fresh Android Scaffold with valid project name
          rm -rf android
          flutter create --project-name coach_spot --org com.coachspot --platforms android .

          # 4. Set compileSdk 35 and minSdk 21
          sed -i 's/compileSdk = .*/compileSdk = 35/' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdkVersion = .*/minSdkVersion = 21/' android/app/build.gradle 2>/dev/null || true
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/' android/app/build.gradle 2>/dev/null || true

          # 5. Build
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons

          mkdir -p $GITHUB_WORKSPACE/output_apk
          cp build/app/outputs/flutter-apk/app-debug.apk $GITHUB_WORKSPACE/output_apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoachSpot-App
          path: output_apk/app-debug.apk
